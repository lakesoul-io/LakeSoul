pre-commit:
  parallel: false
  jobs:
    - name: Format
      glob: "*.{rs,java,scala,sbt,py,toml,yml,yaml,json}"
      run: treefmt --ci -- {staged_files}

commit-msg:
  jobs:
    - name: DCO Signoff
      run: |
        grep -qE '^Signed-off-by: .+ <[^>]+@[^>]+>$' "{1}"
pre-push:
  parallel: false
  jobs:
    - name: Rust Clippy
      run: cargo clippy --no-deps --all-features --all-targets --workspace -- -D warnings
