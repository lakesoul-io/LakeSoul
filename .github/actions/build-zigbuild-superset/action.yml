name: Build zigbuild superset
description: >-
  Build the full gnu217 test-fast target graph shared by every Rust-cache
  gnu217 job. Every caller MUST use this action so the shared gnu217-testfast
  cache entry is complete no matter which job saves it first.

runs:
  using: composite
  steps:
    - name: Build gnu217 test-fast superset
      shell: bash
      env:
        CARGO_PROFILE_RELEASE_STRIP: none
      run: |
        # Keep the hdfs JNI build independent of any runner-local Hadoop and
        # point it at a stable JDK path. Every caller must run the same steps
        # so the cached artifacts are byte-for-byte reusable across jobs.
        unset HADOOP_HOME HDFS_LIB_DIR
        sudo ln -sfn "$JAVA_HOME" /opt/lakesoul-jdk
        export JAVA_HOME=/opt/lakesoul-jdk
        cargo zigbuild --profile test-fast --target x86_64-unknown-linux-gnu.2.17 \
          --package lakesoul-io-c --package lakesoul-metadata-c \
          --package lakesoul-console --package lakesoul-python \
          --package lakesoul-datafusion \
          --features lakesoul-io-c/hdfs,lakesoul-python/ci-unify,lakesoul-datafusion/ci \
          --all-targets
