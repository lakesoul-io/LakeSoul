name: CI with Python Test
on:
  push:
    paths-ignore:
      - "javadoc/**"
      - "website/**"
      - "**.md"
    branches:
      - "main"
      - "release/**"
    tags:
      - "py-v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    paths-ignore:
      - "javadoc/**"
      - "website/**"
      - "**.md"
    branches:
      - "main"
      - "release/**"
  workflow_dispatch:

jobs:
  run-pytest:
    runs-on: ubuntu-24.04
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres:14.5
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: lakesoul_test
          POSTGRES_USER: lakesoul_test
          POSTGRES_DB: lakesoul_test
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --name lakesoul-test-pg
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432
      rustfs:
        image: swr.cn-southwest-2.myhuaweicloud.com/dmetasoul-repo/rustfs/rustfs:1.0.0-beta.3
        ports:
          - "9000:9000"
          - "9001:9001"
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
          RUSTFS_CONSOLE_ENABLE: true
    steps:
      - name: Wait for RustFS
        run: |
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:9000/health \
              && curl -fsS http://127.0.0.1:9001/rustfs/console/health; then
              echo "RustFS is ready"
              exit 0
            fi

            echo "Waiting for RustFS..."
            sleep 2
          done
          echo "RustFS failed to become ready"
          exit 1
      - name: Setup RustFS bucket
        run: |
          docker run --rm --network host \
            --entrypoint /bin/sh \
            swr.cn-southwest-2.myhuaweicloud.com/dmetasoul-repo/rustfs/rc:v0.1.16 \
            -c '
              set -e

              until rc alias set rustfs http://127.0.0.1:9000 rustfsadmin rustfsadmin; do
                echo "RustFS is not ready yet, retrying in 2 seconds..."
                sleep 2
              done

              echo "Create test bucket if not exists"
              until rc mb rustfs/lakesoul-test-bucket --ignore-existing; do
                echo "Bucket creation failed, retrying in 2 seconds..."
                sleep 2
              done

              echo "RustFS Configuration Complete!"
            '
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install psql
        run: sudo apt-get install -y postgresql-client-16
      - name: Init PG
        run: |
          ./script/meta_init_for_local_test.sh -j 2
      - name: Install Protoc
        uses: arduino/setup-protoc@v2
        with:
          version: "23.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-suffix: "lakesoul-py-ci"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> rust/target"
          env-vars: "JAVA_HOME"
      - name: pytest
        env:
          LAKESOUL_SOURCE_DIR: ${{ github.workspace }}
          LAKESOUL_S3_TEST: "1"
        run: |
          mvn package -pl :lakesoul-spark-3.5_2.12 -am -DskipTests
          cd python
          uv sync --python 3.10 --group dev
          export LAKESOUL_IO_USE_V2_MERGE=true
          cargo run --release -p lakesoul-console -- tpch-gen -p "file:///tmp/lakesoul/tpch_data" --scale-factor 0.1 -n 8
          cargo run --release -p lakesoul-console -- -f test.sql
          .venv/bin/python -m pytest ./tests/ -s
  publish:
    runs-on: ubuntu-24.04
    if: startsWith(github.event.ref, 'refs/tags/py-v')
    needs: ["run-pytest"]
    env:
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: build
        run: |
          cd python && uvx --from 'maturin[zig]' maturin build --release --zig --target x86_64-unknown-linux-gnu --auditwheel repair --compatibility manylinux2014 --out ../dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
