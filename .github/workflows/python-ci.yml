name: CI with Python Test
on:
  push:
    paths-ignore:
      - "integrations/javadoc/**"
      - "website/**"
      - "**.md"
      - "rust/lakesoul-es-gateway/**"
      - "rust/lakesoul-ivm/**"
      - "rust/postgres-lakesoul/**"
      - "script/weknora-es-harness/**"
    branches:
      - "main"
      - "release/**"
    tags:
      - "py-v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    paths-ignore:
      - "integrations/javadoc/**"
      - "website/**"
      - "**.md"
      - "rust/lakesoul-es-gateway/**"
      - "rust/lakesoul-ivm/**"
      - "rust/postgres-lakesoul/**"
      - "script/weknora-es-harness/**"
    branches:
      - "main"
      - "release/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-pytest:
    runs-on: ubuntu-24.04
    env:
      # Match rust-ci's test job so Python CI can reuse rust-test-fast.
      RUSTFLAGS: "-Awarnings -C link-arg=-fuse-ld=lld"
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres:14.5
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: lakesoul_test
          POSTGRES_USER: lakesoul_test
          POSTGRES_DB: lakesoul_test
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --name lakesoul-test-pg
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432
      rustfs:
        image: swr.ap-southeast-3.myhuaweicloud.com/dmetasoul-repo/rustfs/rustfs:1.0.0-beta.3
        ports:
          - "9000:9000"
          - "9001:9001"
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
          RUSTFS_CONSOLE_ENABLE: true
    steps:
      - name: Wait for RustFS
        run: |
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:9000/health \
              && curl -fsS http://127.0.0.1:9001/rustfs/console/health; then
              echo "RustFS is ready"
              exit 0
            fi

            echo "Waiting for RustFS..."
            sleep 2
          done
          echo "RustFS failed to become ready"
          exit 1
      - name: Setup RustFS bucket
        run: |
          docker run --rm --network host \
            --entrypoint /bin/sh \
            swr.ap-southeast-3.myhuaweicloud.com/dmetasoul-repo/rustfs/rc:v0.1.16 \
            -c '
              set -e

              until rc alias set rustfs http://127.0.0.1:9000 rustfsadmin rustfsadmin; do
                echo "RustFS is not ready yet, retrying in 2 seconds..."
                sleep 2
              done

              echo "Create test bucket if not exists"
              until rc mb rustfs/lakesoul-test-bucket --ignore-existing; do
                echo "Bucket creation failed, retrying in 2 seconds..."
                sleep 2
              done

              echo "RustFS Configuration Complete!"
            '
      - uses: actions/checkout@v5
      - name: Validate Python release tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: python script/release.py check-tag "$GITHUB_REF_NAME"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: ./.github/actions/setup-flatc
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install psql
        run: sudo apt-get install -y postgresql-client-16
      - name: Init PG
        run: |
          ./script/meta_init_for_local_test.sh -j 2
      - name: Install Protoc
        uses: ./.github/actions/setup-protoc
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install lld
        run: |
          sudo apt-get update
          sudo apt-get install -y lld
          command -v ld.lld >/dev/null || sudo ln -s "$(command -v lld)" /usr/local/bin/ld.lld
      # Reuse rust-ci's rust-test-fast tier: Python only needs a host build to
      # run pytest, and matching the test job's profile, target, linker and
      # RUSTFLAGS lets the dependency artifacts carry over.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> rust/target"
          shared-key: "rust-test-fast"
          save-if: false

      - name: Build native libraries
        run: |
          cargo build --profile test-fast --package lakesoul-io-c --package lakesoul-metadata-c --package lakesoul-console --package lakesoul-python --features lakesoul-python/ci-unify
          mkdir -p rust/target/release
          cp rust/target/test-fast/liblakesoul_io_c.so rust/target/release/
          cp rust/target/test-fast/liblakesoul_metadata_c.so rust/target/release/
          cp rust/target/test-fast/liblakesoul_python.so python/src/lakesoul/_lib.abi3.so
      - name: pytest
        env:
          LAKESOUL_SOURCE_DIR: ${{ github.workspace }}
          LAKESOUL_S3_TEST: "1"
          PYTHONPATH: ${{ github.workspace }}/python/src
        run: |
          mvn package -pl :lakesoul-spark-3.5_2.12 -am -DskipTests -Pcross-build
          cd python
          uv sync --no-install-project --python 3.11 --group dev
          export LAKESOUL_IO_USE_V2_MERGE=true
          ../rust/target/test-fast/lakesoul-console tpch-gen -p "file:///tmp/lakesoul/tpch_data" --scale-factor 0.1 -n 8
          ../rust/target/test-fast/lakesoul-console -f test.sql
          .venv/bin/python -m pytest ./tests/ -s
      - name: pytest (Daft Ray runner)
        env:
          LAKESOUL_SOURCE_DIR: ${{ github.workspace }}
          LAKESOUL_DAFT_RAY_TEST: "1"
          PYTHONPATH: ${{ github.workspace }}/python/src
        run: |
          cd python
          .venv/bin/python -m pytest tests/embodied/test_daft_ray.py -s
  publish:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/py-v')
    needs: ["run-pytest"]
    env:
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install Protoc
        uses: ./.github/actions/setup-protoc
      # `maturin build` compiles the extension, so the vortex build script still needs flatc.
      - uses: ./.github/actions/setup-flatc
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: build
        run: |
          cd python && uvx --from 'maturin[zig]' maturin build --release --zig --target x86_64-unknown-linux-gnu --auditwheel repair --compatibility manylinux2014 --out ../dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
