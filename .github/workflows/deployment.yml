name: Deployment
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven
      - name: Install Protoc
        uses: arduino/setup-protoc@v2
        with:
          version: "23.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> rust/target"
          env-vars: "JAVA_HOME"
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5
      - name: Build native libraries
        run: cross -q build --target x86_64-unknown-linux-gnu --package lakesoul-io-c --package lakesoul-metadata-c --release --all-features
      - uses: actions/upload-artifact@v4
        with:
          name: lakesoul-nativeio-x86_64-unknown-linux-gnu
          path: ./rust/target/x86_64-unknown-linux-gnu/release/liblakesoul_io_c.so
      - uses: actions/upload-artifact@v4
        with:
          name: lakesoul-nativemetadata-x86_64-unknown-linux-gnu
          path: ./rust/target/x86_64-unknown-linux-gnu/release/liblakesoul_metadata_c.so

  deploy-maven-package:
    runs-on: ubuntu-24.04
    needs: build-linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lakesoul-nativeio-x86_64-unknown-linux-gnu
          path: ./target/release/
      - uses: actions/download-artifact@v4
        with:
          name: lakesoul-nativemetadata-x86_64-unknown-linux-gnu
          path: ./target/release/
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_SIGN_GPG_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Install Protoc
        uses: arduino/setup-protoc@v2
        with:
          version: "23.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Release to Maven Central Repository
        run: mvn --batch-mode deploy -Pcross-build,release-sign-artifacts -DskipTests -Dmaven.test.skip=true
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_SIGN_GPG_PASSPHRASE }}
