name: Core Release

on:
  pull_request:
    branches:
      - "release/**"
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write
jobs:
  release:
    uses: ./.github/workflows/release-build.yml
    with:
      publish: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}
      tag: ${{ github.event_name == 'push' && github.ref_name || '' }}
    secrets:
      OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
      MAVEN_SIGN_GPG_KEY: ${{ secrets.MAVEN_SIGN_GPG_KEY }}
      MAVEN_SIGN_GPG_PASSPHRASE: ${{ secrets.MAVEN_SIGN_GPG_PASSPHRASE }}
      GH_PAGES_DEPLOY: ${{ secrets.GH_PAGES_DEPLOY }}
