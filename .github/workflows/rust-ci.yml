on:
  push:
    paths:
      - "rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-ci.yml"
    branches:
      - "main"
  pull_request:
    paths:
      - "rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-ci.yml"
    branches:
      - "main"
      - "release/**"
  workflow_dispatch:
  schedule:
    # Nightly full IVM suite; the core IVM steps run on push/PR instead.
    - cron: "0 2 * * *"

name: Rust CI

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust_ci:
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "-Awarnings -C link-arg=-fuse-ld=lld"
      # Metadata PostgreSQL used by the postgres-lakesoul contract tests.
      LAKESOUL_PG_URL: "jdbc:postgresql://127.0.0.1:5432/lakesoul_test?stringtype=unspecified"
      LAKESOUL_PG_USERNAME: lakesoul_test
      LAKESOUL_PG_PASSWORD: lakesoul_test
      TZ: UTC
      # One package selection for every cargo invocation in this job. Cargo
      # resolves features per invocation, and the selected packages' dev-deps
      # take part in that unification. A different selection -- a bare
      # `-p postgres-lakesoul`, for example -- resolves a different feature set
      # (tokio without `test-util`, libc without `extra_traits`, ...), which
      # recompiles that crate plus its entire dependent subtree.
      TEST_PKGS: >-
        -p lakesoul-build-info -p lakesoul-metadata-proto -p lakesoul-metadata
        -p lakesoul-common -p lakesoul-io -p lakesoul-vector
        -p lakesoul-datafusion -p lakesoul-console -p lakesoul-worker
        -p postgres-lakesoul
      # Keep the IVM cargo invocations on the same package selection as the
      # main Rust tests.  A package-only selection changes the feature
      # unification of shared crates and recompiles arrow/datafusion/vortex.
      IVM_FEATURES: "lakesoul-ivm/distributed,lakesoul-datafusion/ivm"
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: swr.ap-southeast-3.myhuaweicloud.com/dmetasoul-repo/postgres:18
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: lakesoul_test
          POSTGRES_USER: lakesoul_test
          POSTGRES_DB: lakesoul_test
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --name lakesoul-test-pg
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432
      rustfs:
        image: swr.ap-southeast-3.myhuaweicloud.com/dmetasoul-repo/rustfs:1.0.4
        ports:
          - "9000:9000"
          - "9001:9001"
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
          RUSTFS_CONSOLE_ENABLE: true

    steps:
      - name: Wait for RustFS
        run: |
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:9000/health \
              && curl -fsS http://127.0.0.1:9001/rustfs/console/health; then
              echo "RustFS is ready"
              exit 0
            fi

            echo "Waiting for RustFS..."
            sleep 2
          done
          echo "RustFS failed to become ready"
          exit 1
      - name: Setup RustFS bucket
        run: |
          docker run --rm --network host \
            --entrypoint /bin/sh \
            swr.ap-southeast-3.myhuaweicloud.com/dmetasoul-repo/rustfs/rc:v0.1.37 \
            -c '
              set -e

              until rc alias set rustfs http://127.0.0.1:9000 rustfsadmin rustfsadmin; do
                echo "RustFS is not ready yet, retrying in 2 seconds..."
                sleep 2
              done

              echo "Create test bucket if not exists"
              until rc mb rustfs/lakesoul-test-bucket --ignore-existing; do
                echo "Bucket creation failed, retrying in 2 seconds..."
                sleep 2
              done

              echo "RustFS Configuration Complete!"
            '
      - uses: actions/checkout@v5
      - name: Strict TPC-H driver boundary regressions
        env:
          PYTHONPATH: rust/postgres-lakesoul/benchmark/driver
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s rust/postgres-lakesoul/benchmark/driver/tests -v
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: ./.github/actions/setup-flatc
      # Canonical producer for rust-test-fast. Clippy, TPC-H, IVM, and release
      # gates only restore it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> rust/target"
          shared-key: "rust-test-fast"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install requirement
        uses: ConorMacBride/install-package@v1
        with:
          apt: postgresql-client-16
      - name: Install lld
        run: |
          sudo apt-get update
          sudo apt-get install -y lld
          command -v ld.lld >/dev/null || sudo ln -s "$(command -v lld)" /usr/local/bin/ld.lld
      - name: Init PG
        run: |
          ./script/meta_init_for_local_test.sh -j 1
      - name: Install Protoc
        uses: ./.github/actions/setup-protoc
      - name: Test legacy merge
        env:
          LAKESOUL_IO_USE_V2_MERGE: "false"
          RUST_LOG: info
          RUST_BACKTRACE: full
        run: |
          cargo test --profile test-fast $TEST_PKGS --lib --bins --tests --jobs 4
      - name: PostgreSQL SQL compatibility (legacy merge)
        env:
          LAKESOUL_IO_USE_V2_MERGE: "false"
          RUST_BACKTRACE: full
        run: cargo test --profile test-fast $TEST_PKGS --bins --test sql_compat --test session_contract --test storage_contract --test catalog_contract --test vector_contract --test tpch_contract --test ddl_contract --test insert_contract --test update_contract --jobs 4 -- --nocapture
      - name: Test v2 merge
        env:
          LAKESOUL_IO_USE_V2_MERGE: "true"
          RUST_LOG: info
          RUST_BACKTRACE: full
        run: |
          cargo test --profile test-fast $TEST_PKGS --lib --bins --tests --jobs 4
      - name: PostgreSQL SQL compatibility (v2 merge)
        env:
          LAKESOUL_IO_USE_V2_MERGE: "true"
          RUST_BACKTRACE: full
        run: cargo test --profile test-fast $TEST_PKGS --bins --test sql_compat --test session_contract --test storage_contract --test catalog_contract --test vector_contract --test tpch_contract --test ddl_contract --test insert_contract --test update_contract --jobs 4 -- --nocapture

      # IVM core tests run on every Rust change.  They reuse the
      # rust-test-fast cache key of this job; do not add a separate key.
      # Every invocation keeps the full TEST_PKGS selection (plus
      # lakesoul-ivm) so shared dependency features stay unified.
      - name: IVM unit tests
        if: github.event_name != 'schedule'
        env:
          RUST_LOG: info
          RUST_BACKTRACE: full
        run: |
          cargo test --profile test-fast $TEST_PKGS -p lakesoul-ivm \
            --features "$IVM_FEATURES" --lib --jobs 4

      - name: IVM SQL oracle
        if: github.event_name != 'schedule'
        env:
          RUST_BACKTRACE: full
        run: |
          cargo test --profile test-fast $TEST_PKGS -p lakesoul-ivm \
            --features "$IVM_FEATURES" --test sql_oracle --jobs 4 \
            -- --test-threads=1

      - name: IVM sqllogic and recovery tests
        if: github.event_name != 'schedule'
        env:
          RUST_LOG: info
          RUST_BACKTRACE: full
        run: |
          cargo test --profile test-fast $TEST_PKGS -p lakesoul-ivm \
            --features "$IVM_FEATURES" \
            --test sqllogic --test distributed_sink --test coordinator_kill \
            --test metadata_partition --jobs 4

      - name: Distributed IVM planner tests
        if: github.event_name != 'schedule'
        env:
          RUST_BACKTRACE: full
        run: |
          cargo test --profile test-fast $TEST_PKGS -p lakesoul-ivm \
            --features "$IVM_FEATURES" --lib test_distributed_ivm --jobs 4

      # The full IVM suite is nightly-only: it builds every integration test
      # binary and is too slow for every PR.  Enumerate the IVM test targets so
      # the full TEST_PKGS selection does not also run every other package's
      # integration tests.
      - name: Full IVM suite
        if: github.event_name == 'schedule'
        env:
          RUST_LOG: info
          RUST_BACKTRACE: full
        run: |
          tests=()
          for file in rust/lakesoul-ivm/tests/*.rs; do
            tests+=(--test "$(basename "$file" .rs)")
          done
          cargo test --profile test-fast $TEST_PKGS -p lakesoul-ivm \
            --features "$IVM_FEATURES" --lib "${tests[@]}" --jobs 4

  clippy_check:
    runs-on: ubuntu-24.04
    env:
      # Match the test job's compiler flags so both jobs share rust-test-fast.
      # Warnings are denied on the clippy command line instead of RUSTFLAGS,
      # because RUSTFLAGS participates in the cache key and dependency fingerprints.
      RUSTFLAGS: "-Awarnings -C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - uses: ./.github/actions/setup-flatc
      - name: Install Protoc
        uses: ./.github/actions/setup-protoc
      - name: Install lld
        run: |
          sudo apt-get update
          sudo apt-get install -y lld
          command -v ld.lld >/dev/null || sudo ln -s "$(command -v lld)" /usr/local/bin/ld.lld
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> rust/target"
          shared-key: "rust-test-fast"
          save-if: false
      - name: Run Clippy
        # Keep every cargo invocation in this workflow on `test-fast` so all
        # artifacts stay in a single profile directory (rust/target/test-fast).
        # One invocation with one feature set also avoids recompiling the
        # shared datafusion/arrow/vortex graph for the IVM packages.
        run: >-
          cargo clippy --profile test-fast --no-deps --all-features
          -p lakesoul-io-c -p lakesoul-metadata-c -p lakesoul-python
          -p lakesoul-io -p lakesoul-ivm -p lakesoul-datafusion
          -- -D warnings
