name: CI with compaction clean e2e Test

on:
  push:
    paths-ignore:
      - "javadoc/**"
      - "website/**"
      - "cpp/**"
      - "python/**"
      - "**.md"
      - "script/benchmark/**"
    branches:
      - "main"
  pull_request:
    paths-ignore:
      - "javadoc/**"
      - "website/**"
      - "cpp/**"
      - "python/**"
      - "**.md"
      - "script/benchmark/**"
    branches:
      - "main"
      - "release/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compaction-clean-e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: lakesoul_test
          POSTGRES_PASSWORD: lakesoul_test
          POSTGRES_DB: lakesoul_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        command: -c wal_level=logical
      rustfs:
        image: swr.cn-southwest-2.myhuaweicloud.com/dmetasoul-repo/rustfs/rustfs:1.0.0-beta.3
        ports:
          - "9000:9000"
          - "9001:9001"
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
          RUSTFS_CONSOLE_ENABLE: true
    env:
      LAKESOUL_PG_URL: jdbc:postgresql://127.0.0.1:5432/lakesoul_test
      LAKESOUL_PG_USERNAME: lakesoul_test
      LAKESOUL_PG_PASSWORD: lakesoul_test
      RUSTFLAGS: "-Awarnings"
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven
      - name: Install Protoc
        uses: arduino/setup-protoc@v2
        with:
          version: "23.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build native libraries
        run: |
          cargo build --release -p lakesoul-io-c -p lakesoul-metadata-c
      - name: Initialize metadata schema
        run: |
          PGPASSWORD=lakesoul_test psql -h 127.0.0.1 -U lakesoul_test -d lakesoul_test \
            -v ON_ERROR_STOP=1 -f script/meta_init.sql
      - name: Run compaction clean e2e test
        run: |
          mvn -B -pl lakesoul-flink -am test \
            -Dtest=CleanJobPinnedTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dmaven.build.cache.enabled=false
