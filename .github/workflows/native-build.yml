name: Linux x64 build

on:
  push:
    paths:
      - ".github/workflows/native-build.yml"
      - ".github/actions/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "rust/lakesoul-build-info/**"
      - "rust/lakesoul-common/**"
      - "rust/lakesoul-io/**"
      - "rust/lakesoul-io-c/**"
      - "rust/lakesoul-metadata/**"
      - "rust/lakesoul-metadata-c/**"
      - "rust/lakesoul-metadata-proto/**"
      - "rust/lakesoul-observability/**"
      - "pom.xml"
      - ".mvn/**"
      - "integrations/lakesoul-common/**"
      - "integrations/lakesoul-spark/**"
      - "integrations/lakesoul-spark-gluten/**"
      - "integrations/lakesoul-flink/**"
      - "integrations/lakesoul-presto/**"
      - "integrations/native-io/**"
      - "script/get_jar_name.py"
      - "script/verify_native_jars.py"
    branches:
      - "main"
  pull_request:
    paths:
      - ".github/workflows/native-build.yml"
      - ".github/actions/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "rust/lakesoul-build-info/**"
      - "rust/lakesoul-common/**"
      - "rust/lakesoul-io/**"
      - "rust/lakesoul-io-c/**"
      - "rust/lakesoul-metadata/**"
      - "rust/lakesoul-metadata-c/**"
      - "rust/lakesoul-metadata-proto/**"
      - "rust/lakesoul-observability/**"
      - "pom.xml"
      - ".mvn/**"
      - "integrations/lakesoul-common/**"
      - "integrations/lakesoul-spark/**"
      - "integrations/lakesoul-spark-gluten/**"
      - "integrations/lakesoul-flink/**"
      - "integrations/lakesoul-presto/**"
      - "integrations/native-io/**"
      - "script/get_jar_name.py"
      - "script/verify_native_jars.py"
    branches:
      - "main"
      - "release/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "-Awarnings"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 11
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven

      - name: Install Protoc
        uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable action
        with:
          toolchain: stable
      - uses: ./.github/actions/setup-flatc
      # Canonical producer for native-glibc217-v2. Other zigbuild jobs only restore it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> rust/target"
          shared-key: "native-glibc217-v2"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
          use-cache: false
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.18.3
      - name: Build native libraries
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
        run: |
          unset HADOOP_HOME HDFS_LIB_DIR
          sudo ln -sfn "$JAVA_HOME" /opt/lakesoul-jdk
          export JAVA_HOME=/opt/lakesoul-jdk
          cargo -q zigbuild --release --target x86_64-unknown-linux-gnu.2.17 --package lakesoul-io-c --package lakesoul-metadata-c --all-features
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lakesoul-nativeio-x86_64-unknown-linux-gnu
          path: ./rust/target/x86_64-unknown-linux-gnu/release/liblakesoul_io_c.so
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lakesoul-nativemetadata-x86_64-unknown-linux-gnu
          path: ./rust/target/x86_64-unknown-linux-gnu/release/liblakesoul_metadata_c.so

  build-maven-package:
    runs-on: ubuntu-24.04
    needs: build-linux-x86_64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lakesoul-nativeio-x86_64-unknown-linux-gnu
          path: ./rust/target/release/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lakesoul-nativemetadata-x86_64-unknown-linux-gnu
          path: ./rust/target/release/
      - name: Set up JDK 11
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven
      - name: Install Protoc
        uses: ./.github/actions/setup-protoc
      - name: Build with Maven
        run: |
          MAVEN_OPTS="-Xmx4000m" mvn -B install --file pom.xml -pl "!:lakesoul-presto-0.296" -Pcross-build -DskipTests -Dmaven.test.skip=true -e
      - name: Smoke test Linux x86_64 native loaders
        run: |
          mvn -B test --file pom.xml -pl :lakesoul-io-java -am -Pcross-build \
            -Dtest=NativeLibrarySmokeTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: Set up JDK 17 for Presto
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Build Presto with Java 17
        run: |
          MAVEN_OPTS="-Xmx4000m" mvn -B package --file pom.xml -pl :lakesoul-presto-0.296 -Pcross-build -DskipTests -Dmaven.test.skip=true -e
      - name: Verify packaged native libraries
        run: |
          python script/verify_native_jars.py \
            "integrations/lakesoul-spark/target/$(python script/get_jar_name.py integrations/lakesoul-spark)" \
            "integrations/lakesoul-flink/target/$(python script/get_jar_name.py integrations/lakesoul-flink)" \
            "integrations/lakesoul-presto/target/$(python script/get_jar_name.py integrations/lakesoul-presto)"
      - name: Upload Package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maven-package-upload
          path: |
            integrations/lakesoul-spark/target/lakesoul-spark-*.jar
            integrations/lakesoul-flink/target/lakesoul-flink-*.jar
            integrations/lakesoul-presto/target/lakesoul-presto-*.jar
          retention-days: 3
          if-no-files-found: error
