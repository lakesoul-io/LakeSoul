name: Reusable Website Publication

on:
  workflow_call:
    inputs:
      ref:
        description: Validated final Core release tag
        required: true
        type: string
    secrets:
      GH_PAGES_DEPLOY:
        required: true

  workflow_dispatch:
    inputs:
      ref:
        description: Existing final Core release tag, for example v4.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/tags/{0}', inputs.ref)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out validated release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18
          cache-dependency-path: website/package-lock.json
          cache: npm
      - name: Configure deployment key
        uses: webfactory/ssh-agent@6b2f2c5354ff41f1edbbf7a17ea9b6178c89be9f # v0.5.0
        with:
          ssh-private-key: ${{ secrets.GH_PAGES_DEPLOY }}
      - name: Deploy website
        working-directory: website
        env:
          USE_SSH: true
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "gh-actions"
          npm ci --omit-lockfile-registry-resolved true
          npm run deploy
