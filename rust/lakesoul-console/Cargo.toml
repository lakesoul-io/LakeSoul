[package]
name = "lakesoul-console"
version = { workspace = true }
publish = false
edition = { workspace = true }

[dependencies]
# lakesoul
lakesoul-datafusion = { path = "../lakesoul-datafusion" }
lakesoul-observability = { path = "../lakesoul-observability" }
# datafusion
datafusion = { workspace = true }
# runtime
tokio = { workspace = true }
# cli
clap = { workspace = true }
rustyline = "16.0.0"
base64 = { version = "0.22", features = ["std"] }
# async
futures = { workspace = true }
# rand
rand = { workspace = true }
# logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
# error
rootcause = { workspace = true }
# output
serde_json = { workspace = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }
tikv-jemalloc-ctl = { workspace = true, optional = true }

[features]
default = ["jemalloc"]
# Process allocator (src/allocator.rs); disable for the system allocator.
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]

[lints]
workspace = true
