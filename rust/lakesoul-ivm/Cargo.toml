[package]
name = "lakesoul-ivm"
version = { workspace = true }
publish = false
edition = { workspace = true }

[features]
default = []
distributed = ["dep:datafusion-distributed", "dep:datafusion-proto"]

[dependencies]
lakesoul-common = { path = "../lakesoul-common" }
lakesoul-io = { path = "../lakesoul-io" }
lakesoul-metadata = { path = "../lakesoul-metadata" }
lakesoul-metadata-proto = { path = "../lakesoul-metadata-proto" }
lakesoul-vector = { path = "../lakesoul-vector" }
datafusion = { workspace = true }
datafusion-datasource = { workspace = true }
datafusion-distributed = { workspace = true, optional = true }
datafusion-proto = { workspace = true, optional = true }
prost.workspace = true
arrow = { workspace = true }
futures.workspace = true
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { version = "0.7.8", features = ["with-serde_json-1"] }
tracing = { workspace = true }
metrics = { workspace = true }
rootcause = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
sqllogictest = "0.29"
tempfile = { workspace = true }
test-log = { workspace = true, features = ["trace"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
