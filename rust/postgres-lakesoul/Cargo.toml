[package]
name = "postgres-lakesoul"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
version.workspace = true
publish = false

[dependencies]
lakesoul-build-info = { path = "../lakesoul-build-info" }
lakesoul-common = { path = "../lakesoul-common" }
lakesoul-metadata = { path = "../lakesoul-metadata" }
lakesoul-metadata-proto = { path = "../lakesoul-metadata-proto" }
lakesoul-datafusion = { path = "../lakesoul-datafusion", features = ["ivm"] }
lakesoul-io = { path = "../lakesoul-io" }
lakesoul-ivm = { path = "../lakesoul-ivm" }
lakesoul-observability = { path = "../lakesoul-observability" }
# Keep the exact pin: minor releases have changed public APIs before.
pg_walstream = "=0.10.0"
# Native MySQL logical subscription. The binlog feature exposes
# `Conn::get_binlog_stream`; `mysql_common` parses the row events.
mysql_async = { version = "0.37", default-features = false, features = [
  "default-rustls-ring",
  "binlog",
] }
mysql_common = { version = "0.37", default-features = false, features = [
  "binlog",
] }
encoding_rs = "0.8"
url.workspace = true
datafusion-postgres = { git = "https://github.com/mag1c1an1/datafusion-postgres.git", rev = "4b8b759141757e36a7a5bfc6ead98d71bc044645", features = [
  "pgvector",
] }
datafusion.workspace = true
metrics.workspace = true
object_store.workspace = true
parquet.workspace = true
parking_lot.workspace = true
clap.workspace = true
rootcause.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true
bytes.workspace = true
async-trait.workspace = true
thiserror.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio-postgres = { version = "0.7", features = [
  "with-chrono-0_4",
  "with-serde_json-1",
  "with-uuid-1",
] }
uuid.workspace = true
libc = "0.2"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }
tikv-jemalloc-ctl = { workspace = true, optional = true }

[features]
default = ["jemalloc"]
# Process allocator (src/allocator.rs); disable for the system allocator.
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]

[dev-dependencies]
anyhow.workspace = true
tempfile.workspace = true
uuid.workspace = true
rust_decimal = { version = "1", features = ["db-tokio-postgres"] }
pgvector = { version = "0.4", features = ["postgres"] }
metrics-exporter-prometheus = { workspace = true }
rustls-pki-types = "1"
lakesoul-vector = { path = "../lakesoul-vector" }

[lints]
workspace = true
