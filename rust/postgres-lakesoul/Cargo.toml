[package]
name = "postgres-lakesoul"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
version.workspace = true
publish = false

[dependencies]
lakesoul-build-info = { path = "../lakesoul-build-info" }
lakesoul-common = { path = "../lakesoul-common" }
lakesoul-metadata = { path = "../lakesoul-metadata" }
lakesoul-metadata-proto = { path = "../lakesoul-metadata-proto" }
lakesoul-datafusion = { path = "../lakesoul-datafusion" }
lakesoul-io = { path = "../lakesoul-io" }
lakesoul-ivm = { path = "../lakesoul-ivm" }
lakesoul-observability = { path = "../lakesoul-observability" }
# Keep the exact pin: minor releases have changed public APIs before.
pg_walstream = "=0.10.0"
datafusion-postgres = { git = "https://github.com/mag1c1an1/datafusion-postgres.git", rev = "03441f8aad272c591b3727b341a3e25e45501caf", features = [
  "pgvector",
] }
datafusion.workspace = true
metrics.workspace = true
parking_lot.workspace = true
clap.workspace = true
rootcause.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true
bytes.workspace = true
async-trait.workspace = true
thiserror.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
chrono.workspace = true
serde_json.workspace = true
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
libc = "0.2"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }
tikv-jemalloc-ctl = { workspace = true, optional = true }

[features]
default = ["jemalloc"]
# Process allocator (src/allocator.rs); disable for the system allocator.
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]

[dev-dependencies]
anyhow.workspace = true
tempfile.workspace = true
uuid.workspace = true
rust_decimal = { version = "1", features = ["db-tokio-postgres"] }
pgvector = { version = "0.4", features = ["postgres"] }
metrics-exporter-prometheus = { workspace = true }
rustls-pki-types = "1"
lakesoul-vector = { path = "../lakesoul-vector" }
parquet.workspace = true

[lints]
workspace = true
