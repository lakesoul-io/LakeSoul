apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakesoul-coordinator
  namespace: lakesoul
spec:
  # Phase one: a single coordinator instance. Its discovery resolves the
  # worker's Service EndpointSlices and its PG wire endpoint is served via
  # the `lakesoul-coordinator` Service.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lakesoul
      app.kubernetes.io/component: coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lakesoul
        app.kubernetes.io/component: coordinator
    spec:
      serviceAccountName: lakesoul-coordinator
      containers:
        - name: postgres-lakesoul
          # Single image, binary selected per Pod.
          image: lakesoul-k8s:local
          imagePullPolicy: IfNotPresent
          command: ["/app/postgres-lakesoul"]
          args: []
          # All configuration is environment; no secrets or URLs inlined in
          # args (`docker inspect`-style leak filters stay possible).
          envFrom:
            - configMapRef:
                name: lakesoul-config
          env:
            - name: LAKESOUL_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Metadata database and S3/RustFS credentials live in Secrets.
            - name: LAKESOUL_PG_URL
              valueFrom:
                secretKeyRef:
                  name: lakesoul-secrets
                  key: pg-url
                  optional: false
            - name: LAKESOUL_PG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lakesoul-secrets
                  key: pg-username
                  optional: false
            - name: LAKESOUL_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lakesoul-secrets
                  key: pg-password
                  optional: false
            - name: LAKESOUL_WAREHOUSE
              valueFrom:
                secretKeyRef:
                  name: lakesoul-secrets
                  key: warehouse
                  optional: false
            - name: AWS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: lakesoul-secrets
                  key: aws-endpoint
                  optional: false
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: lakesoul-secrets
                  key: aws-access-key-id
                  optional: false
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lakesoul-secrets
                  key: aws-secret-access-key
                  optional: false
          ports:
            - name: pg
              containerPort: 5432
            - name: metrics
              containerPort: 19090
          # TLS/liveness probes deliberately absent in phase one: no real gRPC
          # health protocol or /readyz exists yet. A TCP probe would only
          # prove the port is listening; adding one would mask readiness
          # rather than prove it.
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: scratch
              mountPath: /var/scratch
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 20Gi
