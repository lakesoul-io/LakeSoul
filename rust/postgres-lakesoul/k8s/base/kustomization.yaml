apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - coordinator-service.yaml
  - coordinator-deployment.yaml
  - worker-service.yaml
  - worker-deployment.yaml
  # configmap.yaml: plain runtime settings (no credentials).
  - configmap.yaml
images:
  # Pods pull with `imagePullPolicy: Always`; the tag (`dev`) comes from the
  # Deployments.
  - name: lakesoul-k8s
    newName: swr.cn-southwest-2.myhuaweicloud.com/dmetasoul-repo/lakesoul-k8s
