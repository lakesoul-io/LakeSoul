apiVersion: v1
kind: ConfigMap
metadata:
  name: lakesoul-config
  namespace: lakesoul
data:
  # Coordinator (postgres-lakesoul).
  LAKESOUL_PG_BIND: "0.0.0.0"
  LAKESOUL_PG_PORT: "5432"
  LAKESOUL_PG_METRICS_ADDR: "0.0.0.0:19090"
  LAKESOUL_WORKER_THREADS: "4"
  # Discovery: EndpointSlice watch over the worker Service in this namespace.
  LAKESOUL_DISTRIBUTED_DISCOVERY: "kubernetes"
  LAKESOUL_K8S_WORKER_SERVICE: "lakesoul-worker"
  LAKESOUL_DISCOVERY_POLL_INTERVAL_SECONDS: "5"
  LAKESOUL_DISCOVERY_MAX_STALENESS_SECONDS: "30"
  # Development-only tolerance for planning failures; production keeps false.
  LAKESOUL_DISTRIBUTED_FALLBACK_LOCAL: "true"
  LAKESOUL_DISTRIBUTED_BYTES_PER_PARTITION: "16777216"
  # Worker (lakesoul-worker), disjoint env names again.
  LAKESOUL_WORKER_PORT: "50051"
  LAKESOUL_WORKER_METRICS_ADDR: "0.0.0.0:19091"
  # Spill directory of the coordinator and workers: their /var/scratch volume,
  # a per-Pod PVC (generic ephemeral volume).
  TMPDIR: "/var/scratch"
  # jemalloc (coordinator and worker): background threads purge freed pages on
  # the decay schedule, so an idle process returns query memory to the OS
  # instead of keeping 1-2 GiB per worker until its next query
  # (benchmark/results/20261027-bgthread-ab-feb90f43).
  MALLOC_CONF: "background_thread:true"
