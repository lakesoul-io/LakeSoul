#
# Scrapes the /metrics endpoint of every LakeSoul Pod in this namespace, the
# container state of those Pods (kubelet cAdvisor, the overlay's own
# kube-state-metrics), and receives the span metrics / service graphs Tempo's
# metrics generator remote-writes (see
# docker/observability/prometheus/prometheus.yml for the host-network
# equivalent).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: lakesoul
    kubernetes_sd_configs:
      # Pod discovery needs only the namespaced Role in rbac.yaml.
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      # Coordinator and worker Pods share `app.kubernetes.io/name: lakesoul`;
      # the observability Pods do not.
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: lakesoul
        action: keep
      # Pod discovery yields one target per declared container port; keep the
      # ones named `metrics` (19090 coordinator, 19091 worker).
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      # `role` is the binary, as in the host-network stack: the container
      # names are `postgres-lakesoul` and `lakesoul-worker`. Never set a
      # `service` target label: the processes export their own `service`
      # label, which the dashboard filters on.
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: role

  # Container memory and CPU throttling the processes cannot report
  # themselves, from every kubelet's cAdvisor. Node discovery and the kubelet's
  # nodes/metrics authorization need the ClusterRole in rbac.yaml. Kubelet
  # serving certificates are commonly self-signed, hence the skipped
  # verification (the token still authenticates Prometheus to the kubelet).
  - job_name: kubelet-cadvisor
    scheme: https
    metrics_path: /metrics/cadvisor
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    kubernetes_sd_configs:
      # Targets each node's InternalIP on its kubelet port (10250).
      - role: node
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
    # A kubelet reports every container on its node: keep only the LakeSoul
    # containers' series the dashboard reads.
    metric_relabel_configs:
      - source_labels: [__name__, namespace, container]
        regex: (container_memory_rss|container_memory_working_set_bytes|container_spec_memory_limit_bytes|container_cpu_cfs_periods_total|container_cpu_cfs_throttled_periods_total);lakesoul;(postgres-lakesoul|lakesoul-worker)
        action: keep

  # Restarts and termination reasons (OOMKilled) of this namespace's
  # containers, from the overlay's namespaced kube-state-metrics.
  - job_name: kube-state-metrics
    # The exported namespace/pod/container labels describe the observed Pod,
    # not kube-state-metrics' own: keep them.
    honor_labels: true
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: kube-state-metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: http-metrics
        action: keep
