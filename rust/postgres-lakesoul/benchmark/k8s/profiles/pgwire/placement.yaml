# One LakeSoul Pod per compute node, never beside a benchmark Pod or the
# observability Pods; the observability Pods gather on one compute node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakesoul-coordinator
  namespace: lakesoul
spec:
  template:
    spec:
      nodeSelector:
        Type: compute
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: lakesoul
              topologyKey: kubernetes.io/hostname
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: lakesoul-bench
              topologyKey: kubernetes.io/hostname
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/part-of: lakesoul
              topologyKey: kubernetes.io/hostname
---
