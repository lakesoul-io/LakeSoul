apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakesoul-coordinator
  namespace: lakesoul
spec:
  template:
    spec:
      containers:
        - name: postgres-lakesoul
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
        - name: sampler
          resources:
            requests:
              cpu: 200m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: scratch
          ephemeral:
            volumeClaimTemplate:
              spec:
                resources:
                  requests:
                    storage: 40Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakesoul-worker
  namespace: lakesoul
spec:
  template:
    spec:
      containers:
        - name: lakesoul-worker
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
        - name: sampler
          resources:
            requests:
              cpu: 200m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 64Mi
