apiVersion: v1
kind: ConfigMap
metadata:
  name: lakesoul-config
  namespace: lakesoul
data:
  LAKESOUL_DISTRIBUTED_DISCOVERY: "none"
  LAKESOUL_K8S_WORKER_SERVICE: null
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakesoul-coordinator
  namespace: lakesoul
spec:
  template:
    spec:
      containers:
        - name: postgres-lakesoul
          env:
            - name: LAKESOUL_K8S_NAMESPACE
              $patch: delete
