apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakesoul-worker
  namespace: lakesoul
spec:
  template:
    spec:
      # Applied once at Pod start; delete the Pod to remove.
      initContainers:
        - name: netem
          image: lakesoul-bench:dev
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Delay the worker's Flight responses (source port 50051) to the coordinator.
              tc qdisc add dev eth0 root handle 1: prio bands 4
              tc qdisc add dev eth0 parent 1:4 handle 40: netem delay "$NETEM_DELAY" "$NETEM_JITTER" rate "$NETEM_RATE"
              tc filter add dev eth0 parent 1: protocol ip u32 match ip sport 50051 0xffff flowid 1:4
              tc -s qdisc show dev eth0
          env:
            - name: NETEM_DELAY
              value: "50ms"
            - name: NETEM_JITTER
              value: "10ms"
            - name: NETEM_RATE
              value: "100mbit"
          securityContext:
            runAsUser: 0
            capabilities:
              add: ["NET_ADMIN"]
