apiVersion: v1
kind: Service
metadata:
  name: {{ include "lakesoul-pg.fullname" . }}-coordinator
  labels:
    {{- include "lakesoul-pg.labels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
spec:
  type: {{ .Values.coordinator.service.type }}
  selector:
    {{- include "lakesoul-pg.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
  ports:
    - name: pg
      port: {{ .Values.coordinator.service.port }}
      targetPort: pg
    - name: metrics
      port: 19090
      targetPort: metrics
