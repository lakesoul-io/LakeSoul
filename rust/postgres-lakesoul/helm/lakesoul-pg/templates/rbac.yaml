{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lakesoul-pg.coordinatorServiceAccountName" . }}
  labels:
    {{- include "lakesoul-pg.labels" . | nindent 4 }}
{{- with .Values.serviceAccount.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lakesoul-pg.workerServiceAccountName" . }}
  labels:
    {{- include "lakesoul-pg.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- with .Values.serviceAccount.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lakesoul-pg.runnerServiceAccountName" . }}
  labels:
    {{- include "lakesoul-pg.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- with .Values.serviceAccount.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "lakesoul-pg.fullname" . }}-discovery
  labels:
    {{- include "lakesoul-pg.labels" . | nindent 4 }}
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "lakesoul-pg.fullname" . }}-discovery
  labels:
    {{- include "lakesoul-pg.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "lakesoul-pg.coordinatorServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "lakesoul-pg.fullname" . }}-discovery
