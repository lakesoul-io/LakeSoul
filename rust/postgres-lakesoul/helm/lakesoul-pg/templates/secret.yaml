{{- if and (not .Values.metadata.existingSecret) (not (and .Values.metadata.postgresql.enabled .Values.metadata.postgresql.existingSecret)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lakesoul-pg.metadataSecretName" . }}
  labels:
    {{- include "lakesoul-pg.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.metadata.postgresql.enabled }}
  pg-url: {{ printf "jdbc:postgresql://%s:5432/%s?stringtype=unspecified" (include "lakesoul-pg.postgresqlServiceName" .) (include "lakesoul-pg.postgresqlDatabase" .) | quote }}
  pg-username: {{ include "lakesoul-pg.postgresqlUsername" . | quote }}
  pg-password: {{ required "metadata.postgresql.password is required when the in-cluster PostgreSQL is enabled" .Values.metadata.postgresql.password | quote }}
  {{- else }}
  pg-url: {{ required "metadata.url or metadata.existingSecret is required" .Values.metadata.url | quote }}
  pg-username: {{ required "metadata.username or metadata.existingSecret is required" .Values.metadata.username | quote }}
  pg-password: {{ required "metadata.password or metadata.existingSecret is required" .Values.metadata.password | quote }}
  {{- end }}
---
{{- end }}
{{- if and (ne .Values.warehouse.type "pvc") (not .Values.warehouse.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lakesoul-pg.warehouseSecretName" . }}
  labels:
    {{- include "lakesoul-pg.labels" . | nindent 4 }}
type: Opaque
stringData:
  warehouse: {{ default (printf "s3://%s/warehouse" (required "warehouse.s3.bucket is required for warehouse.type=s3" .Values.warehouse.s3.bucket)) .Values.warehouse.prefix | quote }}
  aws-endpoint: {{ required "warehouse.s3.endpoint is required for warehouse.type=s3" .Values.warehouse.s3.endpoint | quote }}
  aws-bucket: {{ required "warehouse.s3.bucket is required for warehouse.type=s3" .Values.warehouse.s3.bucket | quote }}
  aws-access-key-id: {{ required "warehouse.s3.accessKeyId is required for warehouse.type=s3" .Values.warehouse.s3.accessKeyId | quote }}
  aws-secret-access-key: {{ required "warehouse.s3.secretAccessKey is required for warehouse.type=s3" .Values.warehouse.s3.secretAccessKey | quote }}
  aws-s3-virtual-host-style: {{ .Values.warehouse.s3.virtualHostStyle | toString | quote }}
{{- end }}
