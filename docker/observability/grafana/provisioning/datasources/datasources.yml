#
# Datasources are linked both ways: metrics carry trace ids as exemplars, Tempo
# exposes span metrics through the Prometheus datasource, and the Tempo
# datasource jumps to Loki for the logs of the service a span belongs to.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      # A sample carrying a `trace_id` exemplar jumps to the trace.
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://127.0.0.1:3200
    jsonData:
      # "Metrics" tab on a trace, backed by the metrics generator output.
      tracesToMetrics:
        datasourceUid: prometheus
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      # A span's service name is the Loki stream's `service` label, so the
      # trace view can open the matching logs. LakeSoul log lines carry no
      # trace id, so the link matches on the service and the span's time range
      # instead of on a trace id.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: false
        filterBySpanID: false
        tags:
          - key: service.name
            value: service
      lokiSearch:
        datasourceUid: loki
      search:
        hide: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://127.0.0.1:3100
    jsonData:
      maxLines: 1000
